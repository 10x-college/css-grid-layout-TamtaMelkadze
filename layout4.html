<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout4</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout4.css">
</head>
<body>
    <section class="lifestyle-layout">


        <main class="main-split-grid">
            
            <div class="left-column">
                <h1 class="title">live as a minimalist</h1>
                <h1 class="subtitle"> lifestyle</h1>
                <figure class="item-top"><img src="darkleaves.jpg" alt="Dark leaves"></figure>
                <figure class="item-middle"><img src="greenleaf.jpg" alt="Leaf"></figure>
                <figure class="item-bottom"><img src="workspace.jpg" alt="Workspace"></figure>
                <figure class="item-bottom-right"><img src="lamp.jpg" alt="Blue Lamp"></figure>
            </div>
<!-- 
            <div class="divider"></div> -->
            

            <div class="right-column">
                <figure class="item-right-1"><img src="cofeecup.jpg" alt="Coffee"></figure>
                <figure class="item-right-2"><img src="vase.jpg" alt="Plant"></figure>
                <figure class="item-right-3"><img src="flowers.jpg" alt="Flowers"></figure>
                <figure class="item-right-5"><img src="leaf.jpg" alt="Vase"></figure>
            </div>
        </main>
    </section>
    
</body>
</html>
