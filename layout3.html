<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>layout3</title>
    <link rel="stylesheet" href="layout3.css">
</head>
<body>
    <section class="gallery-section">
    <header>
        <h1 class="title">Photo Gallery</h1>
    </header>

    <main class="grid-complex">
        <figure class="span-2-col"><img  src="cofeecup.jpg" alt="Large Coffee"></figure>
        <figure><img class="image" src="vase.jpg" alt="Vase"></figure>
        <figure><img class="image" src="workspace.jpg" alt="Workspace"></figure>
        
        <figure><img class="image" src="lamp.jpg" alt="Lamp"></figure>
        <figure class="span-2-row"><img src="flowers.jpg" alt="Flowers"></figure>
        <figure class="span-2-col-wide"><img src="leaf.jpg" alt="Single Leaf"></figure>
        
        <figure><img class="image" src="darkleaves.jpg" alt="Leaves"></figure>
        <figure><img class="image" src="whitecup.jpg" alt="Cup"></figure>
        <figure><img class="image" src="greenleaf.jpg" alt="Wide Leaf"></figure>
    </main>
</section>
    
</body>
</html>
